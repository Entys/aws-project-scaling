global:
  scrape_interval: 15s
 
scrape_configs:
  - job_name: "ec2-node"
    ec2_sd_configs:
      - region: eu-west-3
        port: 9100
 
    relabel_configs:
      # Ne garder que les EC2 avec tag Environment=prod
      - source_labels: [__meta_ec2_tag_Environment]
        regex: prod
        action: keep
 
      - source_labels: [__meta_ec2_private_ip]
        target_label: instance
 
      - source_labels: [__meta_ec2_tag_Name]
        target_label: name
 
      - source_labels: [__meta_ec2_instance_id]
        target_label: ec2_id
 
      - source_labels: [__meta_ec2_tag_Environment]
        target_label: environment