<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Auto-scaling Demo</title>
    <meta http-equiv="refresh" content="2">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }
        
        .instance-id {
            background: linear-gradient(135deg, #FF9900 0%, #FF6600 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.5em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            word-break: break-all;
        }
        
        .info-grid {
            display: grid;
            gap: 15px;
        }
        
        .info-row {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            font-size: 1.1em;
        }
        
        .info-row .emoji {
            font-size: 1.5em;
            margin-right: 15px;
        }
        
        .info-row .label {
            font-weight: bold;
            color: #666;
            margin-right: 10px;
        }
        
        .info-row .value {
            color: #333;
        }
        
        .refresh-notice {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-style: italic;
        }
        
        .stress-button {
            background: #FF4444;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .stress-button:hover {
            background: #CC0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AWS Auto-scaling Demo</h1>
        
        <div class="instance-id">
            {{ instance_id }}
        </div>
        
        <div class="info-grid">
            <div class="info-row">
                <span class="emoji">📍</span>
                <span class="label">Availability Zone:</span>
                <span class="value">{{ az }}</span>
            </div>
            
            <div class="info-row">
                <span class="emoji">🌐</span>
                <span class="label">Private IP:</span>
                <span class="value">{{ private_ip }}</span>
            </div>
            
            <div class="info-row">
                <span class="emoji">💻</span>
                <span class="label">Hostname:</span>
                <span class="value">{{ hostname }}</span>
            </div>
            
            <div class="info-row">
                <span class="emoji">⏰</span>
                <span class="label">Timestamp:</span>
                <span class="value">{{ timestamp }}</span>
            </div>
        </div>
        
        <button class="stress-button" onclick="stressTest()">
            🔥 Stress CPU (Trigger Scale-up)
        </button>
        
        <div class="refresh-notice">
            ↻ Auto-refresh every 2 seconds
        </div>
    </div>
    
    <script>
        function stressTest() {
            alert('⚡ Sending 10 CPU-intensive requests!\n\nWatch Grafana to see CPU spike and auto-scaling in action.');
            
            // Envoie 10 requêtes CPU-intensive
            for(let i = 0; i < 10; i++) {
                fetch('/cpu-intensive')
                    .then(r => r.json())
                    .then(data => console.log('Request', i+1, 'completed:', data))
                    .catch(err => console.error('Error:', err));
            }
        }
    </script>
</body>
</html>
